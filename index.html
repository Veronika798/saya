<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1A0B2E">
    <title>SAYA - Delivery Marketplace vol2 </title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E85A2A;
            --secondary: #7B2CBF;
            --secondary-light: #9D4EDD;
            --accent: #FF9E00;
            --success: #06D6A0;
            --bg-dark: #1A0B2E;
            --bg-card: #2D1B4E;
            --text-light: #F0E6FF;
            --text-muted: #B8A4D4;
            --border: #4A2F6B;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation; /* Prevents double-tap zoom */
        }

        #root {
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .role-switch {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .role-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        /* Card Styles */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 14px 16px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Button Styles */
        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 48px; /* Better touch target for mobile */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #05C792;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #6A1FAD;
            transform: translateY(-2px);
        }

        /* Price Display */
        .price-display {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-label {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .price-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Job List */
        .job-list {
            display: grid;
            gap: 20px;
        }

        .job-card {
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .job-card:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .job-route {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .job-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-light);
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 201, 87, 0.2);
            color: var(--accent);
        }

        .status-transit {
            background: rgba(157, 78, 221, 0.2);
            color: var(--secondary-light);
        }

        .status-completed {
            background: rgba(6, 214, 160, 0.2);
            color: var(--success);
        }

        /* Photo Upload */
        .photo-upload {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-upload:hover {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.05);
        }

        .photo-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 15px;
        }

        /* Map Placeholder */
        .map-container {
            height: 400px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 18px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .map-route {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(45deg, transparent 45%, var(--primary) 45%, var(--primary) 55%, transparent 55%),
                linear-gradient(-45deg, transparent 45%, var(--primary) 45%, var(--primary) 55%, transparent 55%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            opacity: 0.1;
            animation: moveRoute 2s linear infinite;
        }

        @keyframes moveRoute {
            0% { background-position: 0 0, 20px 20px; }
            100% { background-position: 40px 40px, 60px 60px; }
        }

        /* Rating Stars */
        .rating-container {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .star {
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--border);
        }

        .star.filled {
            color: var(--accent);
        }

        .star:hover {
            transform: scale(1.2);
        }

        /* Time Selection */
        .time-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-option {
            flex: 1;
            padding: 15px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .time-option.selected {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
                padding: 20px 0;
            }

            .logo {
                font-size: 28px;
                text-align: center;
            }

            .logo svg {
                width: 32px !important;
                height: 32px !important;
            }

            .role-switch {
                width: 100%;
                justify-content: stretch;
            }

            .role-btn {
                flex: 1;
                padding: 14px 20px;
                font-size: 14px;
            }

            .card {
                padding: 20px;
                border-radius: 12px;
            }

            .card-title {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .card-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            input, select, textarea {
                padding: 16px 14px;
                font-size: 16px; /* Prevents zoom on iOS */
            }

            .btn {
                padding: 18px 28px;
                font-size: 15px;
                width: 100%;
            }

            .price-display {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
            }

            .price-value {
                font-size: 32px;
            }

            .job-card {
                padding: 20px;
            }

            .job-details {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .time-options {
                flex-direction: column;
                gap: 12px;
            }

            .time-option {
                padding: 18px;
            }

            .map-container {
                height: 250px;
            }

            /* Make photo upload area more touch-friendly */
            .photo-upload {
                padding: 30px 20px;
            }

            /* Larger touch targets for rating stars */
            .star {
                font-size: 36px;
            }

            /* Better header layout on mobile */
            .header > div:last-child {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            /* Stack job card actions vertically on mobile */
            .job-card .form-grid {
                grid-template-columns: 1fr;
            }

            .job-card .form-group {
                width: 100%;
            }

            /* Better status badge positioning */
            .job-header {
                flex-direction: column;
                gap: 10px;
            }

            /* Improve empty state on mobile */
            .empty-state {
                padding: 40px 20px;
            }

            .empty-state-icon {
                font-size: 48px;
            }
        }

        /* Extra small phones */
        @media (max-width: 375px) {
            .app-container {
                padding: 10px;
            }

            .card {
                padding: 15px;
            }

            .logo {
                font-size: 24px;
            }

            .card-title {
                font-size: 18px;
                gap: 8px;
            }

            .price-value {
                font-size: 28px;
            }

            .btn {
                padding: 16px 24px;
                font-size: 14px;
            }
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==================== FIREBASE CONFIGURATION ====================
        // Firebase project: saya-a0916
        // Database region: europe-west1 (Belgium)
        const firebaseConfig = {
            apiKey: "AIzaSyAtUfCdw-zaZ6nnA_vn3RbAgDaysakdPFo",
            authDomain: "saya-a0916.firebaseapp.com",
            databaseURL: "https://saya-a0916-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "saya-a0916",
            storageBucket: "saya-a0916.firebasestorage.app",
            messagingSenderId: "981338347577",
            appId: "1:981338347577:web:f62543ea6461a387e955e8",
            measurementId: "G-KVC56M983M"
        };

        // Initialize Firebase
        let db = null;
        let firebaseInitialized = false;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
            firebaseInitialized = true;
            console.log("✅ Firebase connected successfully!");
        } catch (error) {
            console.warn("⚠️ Firebase not configured. Using local memory only.", error);
            firebaseInitialized = false;
        }

        // Database helper functions
        const dbHelpers = {
            // Save order to Firebase
            saveOrder: (order) => {
                if (!firebaseInitialized) return Promise.resolve();
                return db.ref('orders/' + order.id).set(order);
            },

            // Update order in Firebase
            updateOrder: (orderId, updates) => {
                if (!firebaseInitialized) return Promise.resolve();
                return db.ref('orders/' + orderId).update(updates);
            },

            // Listen to all orders
            listenToOrders: (callback) => {
                if (!firebaseInitialized) return () => {};
                const ordersRef = db.ref('orders');
                ordersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    const ordersArray = data ? Object.values(data) : [];
                    callback(ordersArray);
                });
                return () => ordersRef.off('value');
            },

            // Get next order ID
            getNextOrderId: async () => {
                if (!firebaseInitialized) return Date.now();
                const snapshot = await db.ref('orders').once('value');
                const orders = snapshot.val();
                if (!orders) return 1;
                const ids = Object.keys(orders).map(key => parseInt(orders[key].id));
                return Math.max(...ids) + 1;
            }
        };

        // Mock Database (fallback if Firebase not configured)
        const mockDB = {
            orders: [],
            nextOrderId: 1
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showRegistration, setShowRegistration] = useState(false);
            const [role, setRole] = useState('customer'); // 'customer' or 'carrier'
            const [orders, setOrders] = useState([]);
            const [currentOrder, setCurrentOrder] = useState(null);

            // Firebase real-time sync
            useEffect(() => {
                if (firebaseInitialized) {
                    // Listen to orders in real-time
                    const unsubscribe = dbHelpers.listenToOrders((ordersFromDb) => {
                        setOrders(ordersFromDb);
                        console.log("📦 Orders synced from Firebase:", ordersFromDb.length);
                    });

                    return () => unsubscribe();
                } else {
                    // Use local mockDB if Firebase not configured
                    setOrders(mockDB.orders);
                }
            }, []);

            // Customer Form State
            const [formData, setFormData] = useState({
                pickupLocation: 'Tallinn Bakery, Viru 23',
                destination: 'Swedbank HQ, Liivalaia 8',
                goodsDescription: '30 kringles',
                length: '120',
                width: '40',
                height: '30',
                weight: '15',
                deliveryType: 'exact',
                deliveryDate: new Date().toISOString().split('T')[0],
                deliveryTime: '14:00',
                timeWindowStart: '14:00',
                timeWindowEnd: '16:00',
                photo: null,
                link: ''
            });

            const [estimatedPrice, setEstimatedPrice] = useState(0);
            const [carrierPrice, setCarrierPrice] = useState('');

            const handleLogin = (userData) => {
                setCurrentUser(userData);
                setIsAuthenticated(true);
                setRole(userData.userType);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setIsAuthenticated(false);
                setShowRegistration(false);
            };

            // Calculate estimated price
            useEffect(() => {
                const basePrice = 15;
                const weightPrice = parseFloat(formData.weight || 0) * 1;
                const volumePrice = (parseFloat(formData.length || 0) * parseFloat(formData.width || 0) * parseFloat(formData.height || 0)) / 10000;
                const total = basePrice + weightPrice + volumePrice;
                setEstimatedPrice(total.toFixed(2));
            }, [formData.weight, formData.length, formData.width, formData.height]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, photo: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const submitOrder = async () => {
                const orderId = firebaseInitialized ? await dbHelpers.getNextOrderId() : mockDB.nextOrderId++;
                
                const newOrder = {
                    id: orderId,
                    ...formData,
                    customerEmail: currentUser?.email || 'unknown',
                    customerName: currentUser?.name || 'Unknown Customer',
                    status: 'pending',
                    estimatedPrice: estimatedPrice,
                    carrierPrice: null,
                    acceptedBy: null,
                    createdAt: new Date().toISOString(),
                    rating: null
                };
                
                if (firebaseInitialized) {
                    await dbHelpers.saveOrder(newOrder);
                    alert('Order submitted successfully! All carriers will see it now.');
                } else {
                    mockDB.orders.push(newOrder);
                    setOrders([...mockDB.orders]);
                    alert('Order submitted (local only - Firebase not configured)');
                }
                
                setCurrentOrder(newOrder);
            };

            const acceptJob = async (orderId) => {
                const order = orders.find(o => o.id === orderId);
                if (order && carrierPrice) {
                    const updates = {
                        carrierPrice: parseFloat(carrierPrice),
                        status: 'price_offered'
                    };
                    
                    if (firebaseInitialized) {
                        await dbHelpers.updateOrder(orderId, updates);
                    } else {
                        Object.assign(order, updates);
                        setOrders([...mockDB.orders]);
                    }
                    
                    setCarrierPrice('');
                    alert(`Price offer of €${carrierPrice} submitted to customer!`);
                }
            };

            const confirmPrice = async (orderId) => {
                const order = orders.find(o => o.id === orderId);
                if (order) {
                    const updates = {
                        status: 'in_transit',
                        acceptedBy: 'Carrier #1'
                    };
                    
                    if (firebaseInitialized) {
                        await dbHelpers.updateOrder(orderId, updates);
                    } else {
                        Object.assign(order, updates);
                        setOrders([...mockDB.orders]);
                    }
                    
                    alert('Carrier confirmed! Your order is now in transit.');
                }
            };

            const markDelivered = async (orderId) => {
                const order = orders.find(o => o.id === orderId);
                if (order) {
                    const updates = { status: 'completed' };
                    
                    if (firebaseInitialized) {
                        await dbHelpers.updateOrder(orderId, updates);
                    } else {
                        Object.assign(order, updates);
                        setOrders([...mockDB.orders]);
                    }
                    
                    alert('Order marked as delivered!');
                }
            };

            const rateCarrier = async (orderId, rating) => {
                const order = orders.find(o => o.id === orderId);
                if (order) {
                    const updates = { rating: rating };
                    
                    if (firebaseInitialized) {
                        await dbHelpers.updateOrder(orderId, updates);
                    } else {
                        Object.assign(order, updates);
                        setOrders([...mockDB.orders]);
                    }
                    
                    alert(`Thank you for rating ${rating} stars!`);
                }
            };

            const exportOrdersToExcel = () => {
                if (orders.length === 0) {
                    alert('No orders to export!');
                    return;
                }

                // Prepare data for export
                const exportData = orders.map(order => ({
                    'Order ID': order.id,
                    'Pickup Location': order.pickupLocation,
                    'Destination': order.destination,
                    'Goods Description': order.goodsDescription,
                    'Length (cm)': order.length,
                    'Width (cm)': order.width,
                    'Height (cm)': order.height,
                    'Weight (kg)': order.weight,
                    'Delivery Date': order.deliveryDate,
                    'Delivery Time': order.deliveryType === 'exact' ? order.deliveryTime : `${order.timeWindowStart}-${order.timeWindowEnd}`,
                    'Status': order.status,
                    'Estimated Price (€)': order.estimatedPrice,

                    'Accepted By': order.acceptedBy || 'N/A',
                    'Rating': order.rating || 'N/A'
                }));

                // Create workbook
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(exportData);

                // Set column widths
                ws['!cols'] = [
                    { wch: 10 }, // Order ID
                    { wch: 30 }, // Pickup
                    { wch: 30 }, // Destination
                    { wch: 25 }, // Goods
                    { wch: 12 }, // Length
                    { wch: 12 }, // Width
                    { wch: 12 }, // Height
                    { wch: 12 }, // Weight
                    { wch: 15 }, // Date
                    { wch: 15 }, // Time
                    { wch: 15 }, // Status
                    { wch: 18 }, // Est Price
                    { wch: 18 }, // Carrier Price
                    { wch: 20 }, // Accepted By
                    { wch: 10 }  // Rating
                ];

                XLSX.utils.book_append_sheet(wb, ws, 'Orders');

                // Generate filename with timestamp
                const timestamp = new Date().toISOString().slice(0, 10);
                const filename = `SAYA_Orders_${timestamp}.xlsx`;

                // Download
                XLSX.writeFile(wb, filename);
                alert(`Orders exported to ${filename}`);
            };

            const importCarriersFromExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        const carriers = XLSX.utils.sheet_to_json(sheet);

                        console.log('Imported carriers:', carriers);
                        alert(`Successfully imported ${carriers.length} carriers from Excel!`);
                        
                        // In a real app, you would save this to your database
                        // For now, just show success message
                    } catch (error) {
                        alert('Error reading Excel file: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);

                                            <button 
                                                className="btn btn-success" 
                                                onClick={() => confirmPrice(order.id)}
                                                style={{width: '100%', marginTop: '15px'}}
                                            >
                                                Confirm Carrier Price €{order.carrierPrice}
                                            </button>
                                        )}

                                        {order.status === 'in_transit' && (
                                            <div className="map-container">
                                                <div className="map-route"></div>
                                                <div style={{position: 'relative', zIndex: 1}}>
                                                    🚚 In Transit - Live Tracking
                                                </div>
                                            </div>
                                        )}

                                        {order.status === 'completed' && !order.rating && (
                                            <div>
                                                <div style={{marginTop: '20px', marginBottom: '10px', fontWeight: 600}}>
                                                    Rate your carrier:
                                                </div>
                                                <div className="rating-container">
                                                    {[1, 2, 3, 4, 5].map(star => (
                                                        <div 
                                                            key={star}
                                                            className="star"
                                                            onClick={() => rateCarrier(order.id, star)}
                                                        >
                                                            ⭐
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {order.rating && (
                                            <div style={{marginTop: '15px', color: 'var(--success)', fontWeight: 600}}>
                                                ✓ Rated {order.rating} stars - Invoice sent automatically
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        function CarrierView({ orders, carrierPrice, setCarrierPrice, acceptJob, markDelivered }) {
            const availableJobs = orders.filter(o => o.status === 'pending');
            const myJobs = orders.filter(o => o.status === 'in_transit' || o.status === 'completed');

            return (
                <>
                    <div className="card">
                        <div className="card-title">
                            <div className="card-icon">💼</div>
                            Available Jobs
                        </div>

                        {availableJobs.length === 0 ? (
                            <div className="empty-state">
                                <div className="empty-state-icon">📭</div>
                                <div style={{fontSize: '18px', fontWeight: 600, marginBottom: '10px'}}>
                                    No jobs available right now
                                </div>
                                <div>Check back soon for new delivery opportunities</div>
                            </div>
                        ) : (
                            <div className="job-list">
                                {availableJobs.map(order => (
                                    <div key={order.id} className="job-card">
                                        <div className="job-header">
                                            <div>
                                                <div className="job-route">
                                                    📍 {order.pickupLocation} → {order.destination}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="job-details">
                                            <div className="detail-item">
                                                <div className="detail-label">Goods</div>
                                                <div className="detail-value">{order.goodsDescription}</div>
                                            </div>
                                            <div className="detail-item">
                                                <div className="detail-label">Dimensions</div>
                                                <div className="detail-value">{order.length}x{order.width}x{order.height} cm</div>
                                            </div>
                                            <div className="detail-item">
                                                <div className="detail-label">Weight</div>
                                                <div className="detail-value">{order.weight} kg</div>
                                            </div>
                                            <div className="detail-item">
                                                <div className="detail-label">Delivery</div>
                                                <div className="detail-value">
                                                    {order.deliveryType === 'exact' 
                                                        ? `${order.deliveryDate} at ${order.deliveryTime}`
                                                        : `${order.deliveryDate}, ${order.timeWindowStart}-${order.timeWindowEnd}`
                                                    }
                                                </div>
                                            </div>
                                            <div className="detail-item">
                                                <div className="detail-label">Customer Est.</div>
                                                <div className="detail-value">€{order.estimatedPrice}</div>
                                            </div>
                                        </div>

                                        {order.photo && (
                                            <img src={order.photo} alt="Goods" style={{width: '100%', maxHeight: '200px', objectFit: 'cover', borderRadius: '8px', marginTop: '15px'}} />
                                        )}

                                        <div className="form-grid" style={{marginTop: '20px'}}>
                                            <div className="form-group">
                                                <label>Your Price (€)</label>
                                                <input 
                                                    type="number" 
                                                    step="0.01"
                                                    value={carrierPrice}
                                                    onChange={(e) => setCarrierPrice(e.target.value)}
                                                    placeholder="Enter your price"
                                                />
                                            </div>
                                            <div style={{display: 'flex', alignItems: 'flex-end'}}>
                                                <button 
                                                    className="btn btn-primary" 
                                                    onClick={() => acceptJob(order.id)}
                                                    style={{width: '100%'}}
                                                    disabled={!carrierPrice}
                                                >
                                                    Offer Price
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {myJobs.length > 0 && (
                        <div className="card">
                            <div className="card-title">
                                <div className="card-icon">🚚</div>
                                My Active Jobs
                            </div>

                            <div className="job-list">
                                {myJobs.map(order => (
                                    <div key={order.id} className="job-card">
                                        <div className="job-header">
                                            <div>
                                                <div className="job-route">
                                                    {order.pickupLocation} → {order.destination}
                                                </div>
                                                <span className={`status-badge status-${order.status === 'completed' ? 'completed' : 'transit'}`}>
                                                    {order.status.replace('_', ' ')}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="job-details">
                                            <div className="detail-item">
                                                <div className="detail-label">Goods</div>
                                                <div className="detail-value">{order.goodsDescription}</div>
                                            </div>
                                            <div className="detail-item">
                                                <div className="detail-label">Your Price</div>
                                                <div className="detail-value">€{order.carrierPrice}</div>
                                            </div>
                                        </div>

                                        {order.status === 'in_transit' && (
                                            <>
                                                <div className="map-container">
                                                    <div className="map-route"></div>
                                                    <div style={{position: 'relative', zIndex: 1}}>
                                                        📍 Navigate to destination
                                                    </div>
                                                </div>
                                                <button 
                                                    className="btn btn-success" 
                                                    onClick={() => markDelivered(order.id)}
                                                    style={{width: '100%', marginTop: '15px'}}
                                                >
                                                    ✓ Mark as Delivered
                                                </button>
                                            </>
                                        )}

                                        {order.status === 'completed' && (
                                            <div style={{marginTop: '15px', color: 'var(--success)', fontWeight: 600, textAlign: 'center'}}>
                                                ✓ Delivery Completed
                                                {order.rating && ` - Rated ${order.rating} stars`}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
